name: Dashboard bijwerken

on:
  schedule:
    - cron: "0 5 * * *"          # elke dag rond 07:00 NL-tijd
    - cron: "0 14,17 * * 6,0"    # zaterdag en zondag, middag en avond
  workflow_dispatch:             # handmatig starten via het tabblad Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scrape.py
      - name: Wijzigingen opslaan
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add data.json docs/index.html
          git diff --staged --quiet || (git commit -m "Dashboard bijgewerkt" && git push)
