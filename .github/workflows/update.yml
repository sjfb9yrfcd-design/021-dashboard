name: Dashboard bijwerken

on:
  schedule:
    # Elke dag 18:00 Amsterdamse tijd (zomertijd, winter)
    - cron: "0 16 * * *"
    - cron: "0 17 * * *"
    # Zaterdag ook 20:00 (zomertijd, winter)
    - cron: "0 18 * * 6"
    - cron: "0 19 * * 6"
    # Dinsdag ook 13:00 (zomertijd, winter)
    - cron: "0 11 * * 2"
    - cron: "0 12 * * 2"
  workflow_dispatch:             # handmatig starten via het tabblad Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scrape.py
      - name: Wijzigingen opslaan
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add data.json docs/index.html
          if git diff --staged --quiet; then
            echo "Geen wijzigingen"
          else
            git commit -m "Dashboard bijgewerkt"
            git push
          fi
